[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "srm-rmp-od-backend"
version = "1.0.0"
description = "Production Backend for SRM RMP OD Workflow Platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "sqlalchemy>=2.0.28",
    "alembic>=1.13.1",
    "psycopg2-binary>=2.9.9",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "pyjwt>=2.8.0",
    "bcrypt>=4.1.2",
    "python-multipart>=0.0.9",
    "email-validator>=2.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.6",
    "httpx>=0.27.0",
    "ruff>=0.3.3",
    "black>=24.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

